[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terrapfn"
version = "0.1.0"
description = "Foundation tabular intelligence for outdoor trail exertion, safety envelopes, and in-context hiker personalization."
readme = "README.md"
authors = [
    { name = "Aryan Vishwakarma" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tabpfn>=2.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "streamlit-shadcn-ui>=1.4.0",
    "plotly>=5.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "jupyterlab>=4.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
